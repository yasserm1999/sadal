<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sadal</title>
<meta name="theme-color" content="#F5EFE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sadal">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE9; --surface:#FFFFFF; --sunk:#EDE4DB; --ink:#2A1A20; --muted:#73626A; --line:#E6DAD1;
  --brass:#7D1131; --brass-ink:#FFFFFF; --brass-soft:#F7E3E9;
  --plum:#5B3F73; --plum-soft:#ECE4F3; --ok:#2B7553; --ok-soft:#DFF0E7;
  --warn:#AC5C1C; --warn-soft:#F7E8DA; --bad:#A0384A; --bad-soft:#F5E1E5;
  --scrim:rgba(24,18,30,.48);
  --ui:'Figtree','IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Cormorant Garamond','IBM Plex Sans Arabic',Georgia,'Times New Roman',serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181214; --surface:#231A1E; --sunk:#2E2428; --ink:#F3EAEC; --muted:#B2A2A8; --line:#3A2D32;
    --brass:#F08AA6; --brass-ink:#2A0A14; --brass-soft:#3E1F29;
    --plum:#C4A6DC; --plum-soft:#2F2639; --ok:#7CCBA4; --ok-soft:#1D3229;
    --warn:#E5A46D; --warn-soft:#38291C; --bad:#EE8C9C; --bad-soft:#3A2126;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181214; --surface:#231A1E; --sunk:#2E2428; --ink:#F3EAEC; --muted:#B2A2A8; --line:#3A2D32;
  --brass:#F08AA6; --brass-ink:#2A0A14; --brass-soft:#3E1F29;
  --plum:#C4A6DC; --plum-soft:#2F2639; --ok:#7CCBA4; --ok-soft:#1D3229;
  --warn:#E5A46D; --warn-soft:#38291C; --bad:#EE8C9C; --bad-soft:#3A2126;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
small{font-size:.78em}

/* header with stitch line */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 18px 0}
.top-in{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto}
.brand{line-height:0}
.brand img{height:46px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand img{background:#F2E8DE;border-radius:9px;padding:4px 8px;box-sizing:content-box;height:38px}}
:root[data-theme="dark"] .brand img{background:#F2E8DE;border-radius:9px;padding:4px 8px;box-sizing:content-box;height:38px}
.page{color:var(--muted);font-size:14px;font-weight:500}
.stitch{height:1.5px;max-width:720px;margin:10px auto 0;background:repeating-linear-gradient(90deg,var(--brass) 0 7px,transparent 7px 12px);opacity:.75}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}

main{max-width:720px;margin:0 auto;padding:14px 14px calc(140px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--display);font-weight:600;font-size:23px;margin:22px 4px 8px;line-height:1.15}
h2:first-child{margin-top:4px}
.hint{color:var(--muted);font-size:13px;margin:4px 4px 10px}

/* segmented + chips */
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{opacity:.7;margin-left:4px}

/* grouped list */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
button.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.amt{font-variant-numeric:tabular-nums;font-weight:600}
.code{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:10px;background:var(--brass-soft);color:var(--brass);font-weight:700;font-size:13px;flex:none;padding:0 4px}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:4px}
.p-New{background:var(--brass-soft);color:var(--brass)}
.p-Tailoring{background:var(--plum-soft);color:var(--plum)}
.p-Ready{background:var(--ok-soft);color:var(--ok)}
.p-Qualitycheck{background:var(--warn-soft);color:var(--warn)}
.p-Delivered{background:var(--sunk);color:var(--muted)}
.p-Cancelled{background:var(--bad-soft);color:var(--bad)}
.p-Unpaid{background:var(--bad-soft);color:var(--bad)}
.p-Part{background:var(--warn-soft);color:var(--warn)}
.p-Paid{background:var(--ok-soft);color:var(--ok)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left}
.tile .l{color:var(--muted);font-size:13px}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.tile .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}

/* statement */
.st .row{padding:11px 14px}
.st .row .t{font-weight:500}
.st .tot .t,.st .tot .amt{font-weight:700}
.st .sub .t{font-weight:400;color:var(--muted);padding-left:10px}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.bar{height:5px;border-radius:3px;background:var(--sunk);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.bar.low i{background:var(--bad)}

/* search */
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;margin-bottom:10px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto}
nav.tabs button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--brass)}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;height:54px;border-radius:27px;border:0;background:var(--brass);color:var(--brass-ink);font-weight:700;font-size:15px;padding:0 20px 0 16px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(90,10,35,.28)}
.fab[hidden]{display:none}
.fab span{font-size:24px;line-height:1;margin-top:-2px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;height:94%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.sh-head h3{flex:1;margin:0;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.1}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.sheet .stitch{margin:12px 16px 0}
.sh-body{flex:1;overflow-y:auto;padding:6px 16px 20px;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 16px}
.btn.pri{flex:1;background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.del{color:var(--bad)}
.btn.del.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.acts a,.acts button{flex:1;min-width:90px;text-align:center;text-decoration:none;height:40px;line-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}

fieldset{border:0;padding:0;margin:16px 0 0}
legend{font-family:var(--display);font-weight:600;font-size:19px;padding:0;margin-bottom:6px}
.f{display:block;margin-top:10px}
.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f input,.f select,.f textarea{width:100%;min-height:46px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font-size:16px}
.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.grid2>*,.grid3>*{min-width:0}
.f input{min-width:0}
.f input[type=date]{padding-left:8px;padding-right:6px;-webkit-appearance:none;appearance:none}
.grid3.ord{grid-template-columns:.7fr 1.15fr 1.15fr}
.radio{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.radio label{position:relative}
.radio input{position:absolute;opacity:0;inset:0}
.radio span{display:block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;color:var(--muted)}
.radio input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.radio input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px 12px;margin-top:10px;position:relative}
.item .rm{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--bad);font-weight:600;font-size:13px}
.addline{margin-top:10px;width:100%;height:44px;border:1.5px dashed var(--brass);border-radius:12px;background:transparent;color:var(--brass);font-weight:700}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin-top:16px}
.sum div{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.sum div+div{border-top:1px solid var(--line)}
.sum .big{font-weight:700;font-size:16px}
.thumb{width:52px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:var(--sunk)}
.photo{display:flex;gap:14px;align-items:center;margin-top:12px}
.photo img,.photo .ph{width:96px;height:120px;border-radius:12px;object-fit:cover;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:13px;flex:none}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.ithumb{display:block;width:84px;height:105px;object-fit:cover;border-radius:10px;margin-top:10px;background:var(--sunk)}
.ithumb[hidden]{display:none}
.dpick{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 6px;scrollbar-width:none;border-radius:12px}
.dpick::-webkit-scrollbar{display:none}
.dpick.miss{outline:2px solid var(--bad);outline-offset:2px}
.dtile{flex:none;width:86px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:3px;text-align:center}
.dtile img,.dtile i{display:block;width:100%;height:106px;object-fit:cover;border-radius:9px;background:var(--sunk)}
.dtile b{display:block;font-size:12px;padding:4px 0 2px;color:var(--muted)}
.dtile.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass-soft)}
.dtile.on b{color:var(--brass)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.req{color:var(--bad);font-weight:700;margin-left:3px}
.auto{font-style:normal;font-size:11px;font-weight:700;color:var(--brass);background:var(--brass-soft);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.f.af input,.f.af select{background:var(--sunk)}
input.miss,select.miss{border-color:var(--bad)!important;box-shadow:0 0 0 3px var(--bad-soft)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-top:8px}
.link{border:0;background:none;color:var(--brass);font-weight:700;padding:0}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
.tundo{border:0;background:none;color:var(--brass-soft);font-weight:700;padding:4px 2px;font-size:14px;text-decoration:underline}
.row.orow{cursor:pointer}
.row.orow:active{background:var(--sunk)}
button.next{margin-top:7px;border:1.5px solid currentColor;background:transparent!important;border-radius:999px;font:inherit;font-size:13px;font-weight:700;padding:5px 12px;cursor:pointer;white-space:nowrap}
button.next:active{filter:brightness(.9)}
.row.orow{flex-wrap:wrap}
.racts{flex-basis:100%;display:flex;justify-content:flex-end;gap:8px;margin-top:-4px}
.next.inv{color:var(--ink);border-color:var(--line);border-width:1px}
.ro{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>{const v=parseFloat(x);return isFinite(v)?v:0};
const r3=x=>Math.round((+x||0)*1000)/1000;
const money=x=>(x<-0.0005?'−':'')+Math.abs(x||0).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
const omr=x=>`<span class="amt">${money(x)}</span>`;
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,k)=>{const d=new Date((s||today())+'T00:00');if(isNaN(d))return'';d.setDate(d.getDate()+k);return iso(d)};
const fdate=s=>{if(!s)return'';const d=new Date(s+'T00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const digits=p=>String(p||'').replace(/\D/g,'');
const waNum=p=>{const d=digits(p);return d.length===8?'968'+d:d};
const clean=o=>JSON.parse(JSON.stringify(o));
let toastT;
function toast(m,undo){const t=$('#toast');t.textContent=m;if(undo){const b=document.createElement('button');b.type='button';b.textContent='Undo';b.className='tundo';b.onclick=()=>{undo();t.classList.remove('show','act')};t.append(b)}t.classList.toggle('act',!!undo);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show','act'),undo?4500:2200)}

/* ---------- constants ---------- */

async function shrink(file){
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,1400/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85))}catch(e){return file}
}

async function boot(){
  render();
  const C=window.SADAL_CONFIG||{};
  if(!window.supabase||!C.url||/YOUR/.test(C.url+C.anonKey)){mode='setup';render();return}
  sb=supabase.createClient(C.url,C.anonKey);
  sb.auth.onAuthStateChange((ev,ses)=>{if(ses)start();else if(ev!=='TOKEN_REFRESHED'){stop();mode='login';render()}});
  const {data}=await sb.auth.getSession();
  if(data&&data.session)start();else{mode='login';render()}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&started)load()});
}
function stop(){started=false;if(chan){sb.removeChannel(chan);chan=null}COLS.forEach(c=>S[c]=[]);loaded.clear()}
function start(){
  if(started)return;started=true;mode='loading';render();
  chan=sb.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:'records'},p=>{
    if(p.eventType==='DELETE'){const o=p.old||{};if(S[o.col])S[o.col]=S[o.col].filter(x=>x.id!==o.id)}
    else{const r=p.new;if(!r||!S[r.col])return;const v={...r.data,id:r.id};const i=S[r.col].findIndex(x=>x.id===r.id);if(i>=0)S[r.col][i]=v;else S[r.col].push(v)}
    schedule();
  }).subscribe();
  load();
}
async function load(){
  const all=[];let from=0;
  for(;;){const {data,error}=await sb.from('records').select('col,id,data').range(from,from+999);
    if(error){toast('Could not load: '+error.message);return}
    all.push(...data);if(data.length<1000)break;from+=1000}
  COLS.forEach(c=>S[c]=[]);all.forEach(r=>{if(S[r.col])S[r.col].push({...r.data,id:r.id})});
  COLS.forEach(c=>loaded.add(c));mode='cloud';render();
}
async function save(col,obj){
  if(!obj.id)obj.id=uid();
  obj.updatedAt=Date.now();obj=clean(obj);
  const {error}=await sb.from('records').upsert({col,id:obj.id,data:obj,updated_at:new Date().toISOString()});
  if(error){toast('Not saved: '+error.message);return false}
  const i=S[col].findIndex(x=>x.id===obj.id);if(i>=0)S[col][i]=obj;else S[col].push(obj);schedule();
  return true;
}
async function remove(col,id){
  const {error}=await sb.from('records').delete().match({col,id});
  if(error){toast('Not deleted: '+error.message);return false}
  S[col]=S[col].filter(x=>x.id!==id);schedule();return true;
}
async function uploadPhoto(blob){
  const path=`${uid()}.jpg`;
  const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:blob.type||'image/jpeg'});
  if(error)throw error;
  return sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
}

/* ---------- business logic ---------- */
const prod=code=>S.products.find(p=>p.code===code);
function pcost(p){if(!p)return 0;return n(p.baseCpm)*n(p.baseM)+n(p.partCpm)*n(p.partM)+n(p.lahafCpm)*n(p.lahafM)+n(p.acc)+n(p.tailor)+n(p.pack)}
function suggest(cost){if(cost<=0)return 0;if(cost<=15)return 30;if(cost<=17)return 32;if(cost<=21)return 35;if(cost<=25)return 37;return 41}
const fcost=f=>n(f.total)*(f.vat==='exc'?1.05:1);
const fcpm=f=>n(f.meters)?fcost(f)/n(f.meters):0;
const fleft=f=>Math.max(0,n(f.meters)-n(f.used));
function oc(o){
  let gross=0,disc=0,cost=0,qty=0;
  (o.items||[]).forEach(i=>{const g=n(i.qty)*n(i.price);gross+=g;disc+=g*n(i.disc)/100;cost+=n(i.qty)*n(i.cost);qty+=n(i.qty)});
  const sales=gross-disc,total=sales+n(o.delivery),bal=total-n(o.paid);
  return {gross,disc,sales,total,cost,qty,bal,profit:total-cost};
}
function pay(o){const c=oc(o);if(c.total>0&&c.bal<=0.0005)return'Paid';if(n(o.paid)>0)return'Part';return'Unpaid'}
const payLbl={Paid:'Paid',Part:'Part paid',Unpaid:'Unpaid'};
const live=()=>S.orders.filter(o=>o.status!=='Cancelled');
function soldOf(code){return sum(live(),o=>sum(o.items||[],i=>i.code===code?n(i.qty):0))}
const avail=p=>n(p.made)-soldOf(p.code);
function nextNo(){return S.orders.reduce((m,o)=>Math.max(m,n(o.no)),0)+1}
function inP(d,p){
  if(p==='all')return true; if(!d)return false;
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const [dy,dm]=d.split('-').map(Number);
  if(p==='month')return dy===y&&dm===m+1;
  if(p==='last'){const ly=m===0?y-1:y,lm=m===0?12:m;return dy===ly&&dm===lm}
  if(p==='year')return dy===y;
  return true;
}
function customers(){
  const map=new Map();
  [...S.orders].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(o=>{
    const k=digits(o.phone)||('n:'+(o.name||'').trim().toLowerCase()); if(k==='n:')return;
    const c=map.get(k)||{key:k,name:'',phone:'',address:'',orders:0,spent:0,bal:0,m:{},last:''};
    c.name=o.name||c.name;c.phone=o.phone||c.phone;c.address=o.address||c.address;c.last=o.date||c.last;
    if(o.m&&(o.m.length||o.m.chest||o.m.sleeves))c.m=o.m;
    if(o.status!=='Cancelled'){const x=oc(o);c.orders++;c.spent+=x.total;c.bal+=Math.max(0,x.bal)}
    map.set(k,c);
  });
  return [...map.values()].sort((a,b)=>(b.last||'').localeCompare(a.last||''));
}

function orderRow(o){
  const c=oc(o),p=pay(o);
  const items=(o.items||[]).map(i=>`${esc(i.code)}${n(i.qty)>1?' ×'+n(i.qty):''}`).join(', ');
  const late=OPEN.includes(o.status)&&o.due&&o.due<today();
  const nx=OPEN.includes(o.status)?STATUSES[STATUSES.indexOf(o.status)+1]:null;
  const stat=`<span class="pill p-${esc(o.status).replace(/\s/g,'')}">${esc(o.status)}</span>`;
  const nextBtn=(o.status!=='Cancelled')?`<span class="racts"><button type="button" class="next inv" data-act="invoice" data-id="${esc(o.id)}">Invoice PDF ↓</button>${nx?`<button type="button" class="next p-${nx.replace(/\s/g,'')}" data-act="advance" data-id="${esc(o.id)}">Move to ${nx} ›</button>`:''}</span>`:'';
  return `<div class="row orow" role="button" tabindex="0" data-act="edit-order" data-id="${esc(o.id)}">
    <span class="code">#${esc(o.no)}</span>
    <span class="main"><span class="t">${esc(o.name||'No name')}</span>
      <span class="s">${items||'No items'}${o.due?` · due ${fdate(o.due)}`:''}${late?' · <b class="neg">late</b>':''}</span></span>
    <span class="end">${omr(c.total)}<br>${stat}${o.status!=='Cancelled'?` <span class="pill p-${p}">${payLbl[p]}</span>`:''}</span>${nextBtn}
  </div>`;
}

money(){
  const head=seg('money',[['summary','Summary'],['exp','Expenses']]);

  const p=ui.period;
  if(ui.sub.money==='exp'){
    const es=S.expenses.filter(e=>inP(e.date,p)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    return head+chips+`<p class="hint">Total ${money(sum(es,e=>n(e.amount)))} OMR. Tailor and packaging payments count as cash out only — they're already inside each design's cost.</p>
    <div class="group">${es.length?es.map(e=>`<button class="row" data-act="edit-expense" data-id="${esc(e.id)}"><span class="main"><span class="t">${esc(e.cat)}</span>

  }
  const os=live().filter(o=>inP(o.date,p));
  const gross=sum(os,o=>oc(o).gross),disc=sum(os,o=>oc(o).disc),deliv=sum(os,o=>n(o.delivery));
  const rev=gross-disc+deliv,cogs=sum(os,o=>oc(o).cost),gp=rev-cogs;
  const es=S.expenses.filter(e=>inP(e.date,p));
  const opex=es.filter(e=>!inCostCat(e.cat));
  const byCat={};opex.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+n(e.amount));
  const opT=sum(opex,e=>n(e.amount)),net=gp-opT;
  const coll=sum(os,o=>Math.min(n(o.paid),oc(o).total));
  const fab=sum(S.fabrics.filter(f=>inP(f.date,p)),fcost);
  const allExp=sum(es,e=>n(e.amount));
  const owed=sum(live(),o=>Math.max(0,oc(o).bal));
  const fStock=sum(S.fabrics,f=>fleft(f)*fcpm(f)),aStock=sum(S.products,pp=>Math.max(0,avail(pp))*pcost(pp));
  const best={};os.forEach(o=>(o.items||[]).forEach(i=>{if(i.code)best[i.code]=(best[i.code]||0)+n(i.qty)}));
  const bestL=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const line=(l,v,cls='')=>`<div class="row ${cls}"><span class="main t">${l}</span><span class="amt ${v<-0.0005?'neg':''}">${money(v)}</span></div>`;
  return head+chips+`

function filt(f,q){
  let os=[...S.orders];
  if(f==='open')os=os.filter(o=>OPEN.includes(o.status));
  else if(f==='unpaid')os=os.filter(o=>o.status!=='Cancelled'&&pay(o)!=='Paid');
  else if(f!=='all')os=os.filter(o=>o.status===f);
  if(q){const s=q.toLowerCase(),d=digits(q);os=os.filter(o=>(o.name||'').toLowerCase().includes(s)||(d&&digits(o.phone).includes(d))||String(o.no)===q.replace('#','')||(o.items||[]).some(i=>(i.code||'').toLowerCase()===s))}
  return os;
}
function olist(){
  const os=filt(ui.of,ui.q.trim()).sort((a,b)=>n(b.no)-n(a.no));
  return os.length?os.map(orderRow).join(''):`<div class="empty"><b>No orders match</b>${S.orders.length?'Try another filter or search.':'Tap “New order” to add your first one.'}</div>`;
}

const radios=(name,val,opts)=>`<div class="radio">${opts.map(o=>`<label><input type="radio" name="${name}" value="${esc(o)}" ${o===val?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;

const V=name=>{const e=$(`#sf [name="${name}"]`);if(!e)return'';if(e.type==='radio'){const c=$(`#sf [name="${name}"]:checked`);return c?c.value:''}return e.value.trim()};

  return `<div class="item"><button type="button" class="rm" data-sact="rmitem">Remove</button>

  <input type="hidden" data-f="code" value="${esc(i.code||'')}">
  <div class="grid3">${fld(A('Qty'),`<input data-f="qty" type="number" inputmode="numeric" min="1" value="${esc(i.qty??1)}">`,'af')}${fld(A('Price'),`<input data-f="price" type="number" inputmode="decimal" step="any" value="${esc(i.price??'')}">`,'af')}${fld('Discount %',`<input data-f="disc" type="number" inputmode="decimal" step="any" value="${esc(i.disc||'')}" placeholder="0">`)}</div>
  <input type="hidden" data-f="cost" value="${esc(i.cost??'')}"></div>`;
}
function readItems(){return $$('#sf .item').map(el=>{const g=f=>$(`[data-f="${f}"]`,el).value.trim();return {code:g('code'),qty:n(g('qty'))||1,price:n(g('price')),disc:n(g('disc')),cost:g('cost')===''?null:n(g('cost'))}}).filter(i=>i.code)}
function readOrder(base){
  const r={...base,no:n(V('no'))||base.no,name:V('name'),phone:V('phone'),address:V('address'),date:V('date'),due:V('due'),status:V('status')||'New',

}
function openOrder(o,prefill){
  const isNew=!o;

  const cs=customers();

  const body=`

    },
    act(a,el){
      if(a==='pick'){const it=el.closest('.item');$$('.dtile',it).forEach(b=>{b.classList.toggle('on',b===el);b.setAttribute('aria-pressed',b===el)});const h=$('[data-f="code"]',it);h.value=el.dataset.v;$('.dpick',it).classList.remove('miss');sheetCtx.onChange(h)}

      if(a==='rmitem'){if($$('#sf .item').length>1)el.closest('.item').remove();else toast('An order needs at least one abaya')}
      if(a==='paidfull'){setV('paid',r3(oc(readOrder(o)).total))}
    }
  });
}

  openSheet(isNew?'Add fabric':esc(f.mat||'Fabric'),body,{

    async onSave(){const r=read();const miss=[];if(!r.supplier)miss.push('supplier');if(!r.mat)miss.push('mat');if(!r.total)miss.push('total');if(!r.meters)miss.push('meters');if(miss.length){flag(miss);return}
      if(r.supplier&&!S.suppliers.some(s=>s.name.toLowerCase()===r.supplier.toLowerCase()))await save('suppliers',{name:r.supplier});
      if(await save('fabrics',r)){closeSheet();toast(isNew?'Fabric added':'Fabric saved')}},
    onDelete:isNew?null:async()=>{if(await remove('fabrics',f.id)){closeSheet();toast('Fabric deleted')}},
    act(a){if(a==='usem'){const e=$('#sf [data-x="use"]'),m=n(e.value);if(!m){toast('Enter meters to take');return}setV('used',r3(n(V('used'))+m));e.value='';sheetCtx.recalc();toast(`${m} m taken — tap Save`)}}
  });
}

/* ----- supplier form ----- */
function openSupplier(s){
  const isNew=!s; s=s?clean(s):{};
  const fs=isNew?[]:S.fabrics.filter(f=>f.supplier===s.name).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const body=`
  ${!isNew&&s.phone?`<div class="acts"><a href="tel:${esc(digits(s.phone))}" target="_blank" rel="noopener">Call</a><a href="https://wa.me/${waNum(s.phone)}" target="_blank" rel="noopener">WhatsApp</a></div>`:''}
  ${fld(R('Shop name'),inp('name',s.name))}
  ${fld('Location',inp('location',s.location,'text','placeholder="Souq Mutrah, Al Khoudh…"'))}
  <div class="grid2">${fld('Contact person',inp('contact',s.contact))}${fld('Phone',inp('phone',s.phone,'tel'))}</div>
  ${fld('What they sell',inp('sells',s.sells,'text','placeholder="Crepe, shifoon, printing…"'))}
  ${fld('Notes',`<textarea name="notes">${esc(s.notes||'')}</textarea>`)}
  ${fs.length?`<fieldset><legend>Purchases</legend><div class="group">${fs.map(f=>`<div class="row"><span class="main"><span class="t">${esc(f.mat)} · ${esc(f.color)}</span><span class="s">${fdate(f.date)||'No date'} · ${n(f.meters)} m</span></span><span class="end">${omr(fcost(f))}</span></div>`).join('')}</div></fieldset>`:''}`;
  openSheet(isNew?'Add supplier':esc(s.name),body,{
    async onSave(){const old=s.name;const r={...s,name:V('name'),location:V('location'),contact:V('contact'),phone:V('phone'),sells:V('sells'),notes:V('notes')};
      if(!r.name){flag(['name']);return}
      if(await save('suppliers',r)){
        if(old&&old!==r.name){for(const f of S.fabrics.filter(f=>f.supplier===old))await save('fabrics',{...f,supplier:r.name})}
        closeSheet();toast(isNew?'Supplier added':'Supplier saved')}},
    onDelete:isNew?null:async()=>{if(await remove('suppliers',s.id)){closeSheet();toast('Supplier deleted')}}
  });
}

/* ----- expense form ----- */
function openExpense(e){
  const isNew=!e; e=e?clean(e):{date:today(),cat:'Marketing & ads'};
  const body=`
  ${KEY}${fld(R('Category'),sel('cat',e.cat,EXP_CATS.map(c=>c.n)))}
  <div class="grid2">${fld(R('Amount'),inp('amount',e.amount,'number'))}${fld(A('Date'),inp('date',e.date,'date'),'af')}</div>
  ${fld('Paid by',inp('by',e.by,'text','list="dl-by" placeholder="Who paid"'))}${dlist('dl-by',S.expenses.map(x=>x.by))}
  ${fld('Note',inp('note',e.note,'text','placeholder="Instagram ad, courier, photoshoot…"'))}
  <p class="note" id="enote"></p>`;
  openSheet(isNew?'Add expense':'Expense',body,{
    recalc(){$('#enote').textContent=inCostCat(V('cat'))?'This is already part of each design’s cost, so it counts in cash only, not again in profit.':''},
    async onSave(){const r={...e,cat:V('cat'),amount:n(V('amount')),date:V('date'),by:V('by'),note:V('note')};if(!r.amount){flag(['amount']);return}
      if(await save('expenses',r)){closeSheet();toast(isNew?'Expense added':'Expense saved')}},
    onDelete:isNew?null:async()=>{if(await remove('expenses',e.id)){closeSheet();toast('Expense deleted')}}
  });
}

/* ---------- invoice ---------- */
async function invoicePDF(o){
  if(!o)return;
  if(!dl){toast('Downloads are not available here');return}
  if(!window.jspdf){toast('Invoice tool did not load. Check your connection and reload.');return}
  toast('Preparing invoice…');
  try{await document.fonts.ready}catch(e){}
  const W=1240,H=1754,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const ink='#241D2C',mut='#6C6475',brass='#7D1131',line='#E0DBE6',bad='#A0384A',ok='#2B7553';
  const SANS="'Figtree','IBM Plex Sans Arabic',sans-serif",SERIF="'Cormorant Garamond','IBM Plex Sans Arabic',Georgia,serif";
  const T=(t,px,py,o2={})=>{const {size=26,w=400,col=ink,al='left',fam=SANS}=o2;x.font=`${w} ${size}px ${fam}`;x.fillStyle=col;x.textAlign=al;x.fillText(String(t??''),px,py)};
  const HL=(y1,col=line,dash)=>{x.save();x.strokeStyle=col;x.lineWidth=2;if(dash)x.setLineDash(dash);x.beginPath();x.moveTo(M,y1);x.lineTo(W-M,y1);x.stroke();x.restore()};
  const M=100,R=W-M,c=oc(o),pd=pay(o)==='Paid';
  const dt=s=>{if(!s)return'';const d=new Date(s+'T00:00');return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})};
  const invNo='INV-'+String(o.no).padStart(4,'0');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  {const lg=$('.brand img');try{await lg.decode()}catch(e){}if(lg&&lg.naturalWidth){const h=160,w=h*lg.naturalWidth/lg.naturalHeight;x.drawImage(lg,M-6,52,w,h)}else T('Sadal',M,190,{size:96,w:600,fam:SERIF})}
  T('Invoice',R,190,{size:44,w:600,fam:SERIF,al:'right'});
  HL(240,brass,[16,11]);
  T('Billed to',M,310,{size:22,col:mut,w:500});
  T(o.name||'',M,355,{size:32,w:700});
  let yy=398; if(o.phone){T(o.phone,M,yy,{size:24,col:mut});yy+=38} if(o.address)T(o.address,M,yy,{size:24,col:mut});
  [['Invoice no.',invNo],['Date',dt(o.date)],['Order no.','#'+o.no]].forEach(([k,v],i)=>{T(k,R-300,310+i*44,{size:22,col:mut,w:500});T(v,R,310+i*44,{size:24,w:600,al:'right'})});
  let y=540;
  const cols=[[M,'Design','left'],[M+420,'Qty','right'],[M+620,'Price','right'],[M+820,'Discount','right'],[R,'Amount','right']];
  x.fillStyle='#F7E3E9';x.fillRect(M,y-40,R-M,60);
  cols.forEach(([cx,l,al])=>T(l,al==='left'?cx+18:(cx===R?cx-18:cx),y,{size:22,w:700,col:brass,al}));
  y+=70;
  (o.items||[]).forEach(i=>{
    const g=n(i.qty)*n(i.price),amt=g*(1-n(i.disc)/100);
    T(i.code,M+18,y,{size:26,w:600});
    T(n(i.qty),M+420,y,{size:26,al:'right'});
    T(money(n(i.price)),M+620,y,{size:26,al:'right'});
    T(n(i.disc)?n(i.disc)+'%':'—',M+820,y,{size:26,al:'right',col:n(i.disc)?ink:mut});
    T(money(amt),R-18,y,{size:26,w:600,al:'right'});
    HL(y+28);y+=72;
  });
  y+=30;
  const L=R-460;
  const tl=(k,v,o3={})=>{T(k,L,y,{size:o3.big?30:24,w:o3.big?700:500,col:o3.big?ink:mut});T(v,R-18,y,{size:o3.big?32:24,w:o3.big?700:600,al:'right',col:o3.col||ink});y+=o3.big?56:46};
  tl('Subtotal',money(c.gross));
  if(c.disc)tl('Discount','−'+money(c.disc));
  tl('Delivery',money(n(o.delivery)));
  x.save();x.strokeStyle=ink;x.lineWidth=2;x.beginPath();x.moveTo(L,y-24);x.lineTo(R,y-24);x.stroke();x.restore();y+=16;
  tl('Total (OMR)',money(c.total),{big:true});
  tl('Paid',money(c.total-c.bal));
  tl('Balance due',money(Math.max(0,c.bal)),{col:c.bal>0.0005?bad:ok});
  y+=40;
  x.fillStyle=pd?'#DFF0E7':'#F5E1E5';const bw=360;x.beginPath();x.roundRect?x.roundRect(M,y-50,bw,70,35):x.rect(M,y-50,bw,70);x.fill();
  T(pd?'Paid by bank transfer':'Payment by bank transfer',M+bw/2,y-5,{size:24,w:700,col:pd?ok:bad,al:'center'});
  HL(H-190,brass,[16,11]);
  T('Thank you for choosing Sadal.',W/2,H-120,{size:34,w:600,fam:SERIF,al:'center'});
  try{
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'pt',format:'a4',compress:true});
    pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,595.28,841.89);
    await doSave(`Sadal-${invNo}-${(o.name||'customer').replace(/[^\w\u0600-\u06FF]+/g,'-')}.pdf`,pdf.output('blob'));
  }catch(e){if(!(e&&e.code==='declined'))toast('Invoice could not be created')}
}

/* ---------- export ---------- */
async function doSave(filename,data){
  try{const type=/\.pdf$/.test(filename)?'application/pdf':/\.csv$/.test(filename)?'text/csv':'application/json';
    const blob=data instanceof Blob?data:new Blob([data],{type});const u=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),10000)}catch(e){toast('Download failed')}
}
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  const rows=[['Order #','Date','Due','Status','Customer','Phone','Address','Design','Qty','Price','Discount %','Line total','Line cost','Delivery','Order total','Paid','Balance','Length','Chest','Sleeves','Notes']];
  [...S.orders].sort((a,b)=>n(a.no)-n(b.no)).forEach(o=>{const c=oc(o);(o.items&&o.items.length?o.items:[{}]).forEach((i,k)=>{
    const lt=n(i.qty)*n(i.price)*(1-n(i.disc)/100);
    rows.push([o.no,o.date,o.due,o.status,o.name,o.phone,o.address,i.code,i.qty,i.price,i.disc,r3(lt),r3(n(i.qty)*n(i.cost)),k?'':o.delivery,k?'':r3(c.total),k?'':o.paid,k?'':r3(c.bal),o.m&&o.m.length,o.m&&o.m.chest,o.m&&o.m.sleeves,k?'':o.notes])})});
  doSave(`sadal-orders-${today()}.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'));
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.closest('#sheet'))return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  const find=(c)=>S[c].find(x=>x.id===id);
  switch(a){
    case 'tab':ui.tab=v;window.scrollTo(0,0);render();break;
    case 'sub':ui.sub[el.dataset.t]=v;render();break;
    case 'of':ui.of=v;render();break;
    case 'ff':ui.ff=v;render();break;
    case 'period':ui.period=v;render();break;
    case 'goorders':ui.tab='orders';ui.sub.orders='list';ui.of=el.dataset.f;ui.q='';window.scrollTo(0,0);render();break;
    case 'cust':ui.sub.orders='list';ui.of='all';ui.q=el.dataset.k;render();break;
    case 'new-order':openOrder();break;
    case 'edit-order':openOrder(find('orders'));break;
    case 'new-design':openDesign();break;
    case 'edit-design':openDesign(find('products'));break;
    case 'new-fabric':openFabric();break;
    case 'edit-fabric':openFabric(find('fabrics'));break;
    case 'new-supplier':openSupplier();break;
    case 'edit-supplier':openSupplier(find('suppliers'));break;
    case 'new-expense':openExpense();break;
    case 'edit-expense':openExpense(find('expenses'));break;
    case 'advance':{const o=find('orders');if(!o||!OPEN.includes(o.status))break;const prev=o.status,nx=STATUSES[STATUSES.indexOf(prev)+1];
      save('orders',{...o,status:nx}).then(ok=>{if(ok)toast(`#${o.no} moved to ${nx}`,()=>save('orders',{...o,status:prev}))});break;}
    case 'invoice':invoicePDF(find('orders'));break;
    case 'login':doLogin();break;
    case 'logout':sb.auth.signOut();break;
    case 'export':exportCSV();break;
    case 'backup':doSave(`sadal-backup-${today()}.json`,JSON.stringify(S,null,1));break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;const l=$('#olist');if(l)l.innerHTML=olist()}});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
$('#sheet').addEventListener('click',async e=>{
  const el=e.target.closest('[data-sact]');if(!el||!sheetCtx)return;
  const a=el.dataset.sact;
  if(a==='close'){closeSheet();return}
  if(a==='save'){el.disabled=true;await sheetCtx.onSave();el.disabled=false;return}
  if(a==='del'){if(!el.classList.contains('arm')){el.classList.add('arm');el.textContent='Tap again to delete';setTimeout(()=>{el.classList.remove('arm');el.textContent='Delete'},3000);return}sheetCtx.onDelete();return}
  if(sheetCtx.act)sheetCtx.act(a,el);
  if(sheetCtx.recalc)sheetCtx.recalc();
});
$('#sheet').addEventListener('input',e=>{if(e.target.classList)e.target.classList.remove('miss');if(sheetCtx&&sheetCtx.recalc)sheetCtx.recalc()});
$('#sheet').addEventListener('change',e=>{if(e.target.classList)e.target.classList.remove('miss');if(!sheetCtx)return;if(sheetCtx.onChange)sheetCtx.onChange(e.target);if(sheetCtx.recalc)sheetCtx.recalc()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lp'||e.target.id==='le')){doLogin();return}if(e.key==='Escape'&&sheetCtx)closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('div[role=button][data-act]')){e.preventDefault();e.target.click()}});

boot();
</script>
